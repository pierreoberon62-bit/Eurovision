<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eurovision 2026 - En direct avec les amis !</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --primary: #1a1a2e;
            --secondary: #16213e;
            --accent: #e94560;
            --success: #4ecca3;
            --text: #ededed;
            --card-bg: #2a2a4a;
            --locked-bg: #1e1e36;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--accent);
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.8rem;
        }

        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--primary); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000;
        }
        
        .login-box {
            background-color: var(--card-bg); padding: 30px; border-radius: 10px;
            text-align: center; width: 80%; max-width: 400px; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .login-box input {
            width: 100%; padding: 10px; margin: 15px 0; border-radius: 5px;
            border: 1px solid var(--accent); background-color: var(--secondary);
            color: white; font-size: 1.1rem; box-sizing: border-box;
        }

        .login-box button {
            background-color: var(--accent); color: white; border: none;
            padding: 10px 20px; font-size: 1.1rem; border-radius: 5px; cursor: pointer; width: 100%;
        }

        #mode-banner {
            background-color: #ff9800; color: #1a1a2e; width: 100%; max-width: 800px;
            padding: 8px; border-radius: 5px; text-align: center; font-weight: bold;
            font-size: 0.85rem; margin-bottom: 15px; display: none;
        }

        .tabs {
            display: flex; width: 100%; max-width: 800px; margin-bottom: 20px;
            background-color: var(--secondary); border-radius: 8px; overflow: hidden;
        }

        .tab-btn {
            flex: 1; padding: 12px 5px; background: none; border: none; color: #aaa;
            font-weight: bold; font-size: 0.9rem; cursor: pointer; transition: 0.2s;
        }

        .tab-btn.active { background-color: var(--accent); color: white; }
        .tab-content { display: none; width: 100%; max-width: 800px; }
        .tab-content.active { display: block; }

        .controls {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; font-size: 0.9rem;
        }

        .btn-action {
            background-color: #555; color: white; border: none; padding: 8px 12px;
            border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.8rem;
        }

        .warning-text { color: #ff9800; font-size: 0.85rem; text-align: center; margin-bottom: 15px; }
        ul { list-style-type: none; padding: 0; margin: 0; }

        /* --- Animation Flash --- */
        @keyframes flashAnimation {
            0% { background-color: #3b5380; box-shadow: 0 0 15px var(--success); }
            100% { background-color: var(--card-bg); }
        }
        
        @keyframes flashAnimationLocked {
            0% { background-color: #3b5380; box-shadow: 0 0 15px #ffd700; }
            100% { background-color: var(--locked-bg); }
        }

        .card {
            background-color: var(--card-bg); margin-bottom: 10px; border-radius: 8px;
            display: flex; box-shadow: 0 4px 6px rgba(0,0,0,0.3); overflow: hidden;
        }
        
        .card.flash-update { animation: flashAnimation 1s ease-out; }
        .card.is-locked.flash-update { animation: flashAnimationLocked 1s ease-out; }
        
        .card.is-locked {
            background-color: var(--locked-bg);
            border-left: 3px solid #ffd700;
        }

        .rank-controls {
            background-color: var(--secondary); min-width: 55px; display: flex; flex-direction: column;
            justify-content: space-between; align-items: center; padding: 5px 0;
        }

        .lock-btn {
            background: none; border: none; font-size: 1.2rem; cursor: pointer; padding: 2px;
            opacity: 0.4; transition: opacity 0.2s;
        }
        .lock-btn.locked { opacity: 1; text-shadow: 0 0 5px rgba(255, 215, 0, 0.5); }

        .move-btn {
            background: none; border: none; color: #aaa; font-size: 1.2rem; cursor: pointer; 
            padding: 2px; width: 100%; display: flex; justify-content: center; align-items: center;
        }

        .move-btn:active { color: var(--accent); }
        .move-btn:disabled { color: #333; pointer-events: none; }

        .rank-select {
            background-color: var(--accent); color: white; border: none; border-radius: 4px; 
            padding: 2px; font-weight: bold; font-size: 0.9rem; text-align: center; width: 35px; 
            appearance: none; -webkit-appearance: none;
        }
        .rank-select:disabled { background-color: #555; cursor: not-allowed; }
        .rank-select option:disabled { color: #888; font-style: italic; }

        .content { padding: 10px; flex-grow: 1; display: flex; flex-direction: column; gap: 6px; justify-content: center; }

        .info { display: flex; flex-direction: column; }

        .country { font-size: 1.1rem; font-weight: bold; color: white; }
        .artist-song { font-size: 0.85rem; color: #ccc; margin-top: 2px; }

        /* --- Option 1 : Notes Rétractables --- */
        .notes-btn {
            background: none; border: none; color: var(--success); cursor: pointer;
            font-size: 0.85rem; padding: 4px 0 0 0; text-align: left; width: fit-content;
            font-weight: bold;
        }
        .notes-wrapper {
            display: none;
            margin-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 8px;
        }

        textarea {
            width: 100%; background-color: #1f1f3a; color: var(--text); border: 1px solid #3f3f6a; 
            border-radius: 4px; padding: 8px; font-family: inherit; font-size: 0.9rem; resize: none; 
            min-height: 60px; box-sizing: border-box;
        }

        #score-board, #leaderboard-box {
            background-color: var(--card-bg); padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 2px solid var(--success);
        }

        .score-title { text-align: center; color: var(--success); margin-top: 0; font-size: 1.5rem; }
        .score-detail { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.9rem; }
        .bonus-badge { color: #ffd700; font-weight: bold; font-size: 0.8rem; }
        
        .leaderboard-item {
            display: flex; justify-content: space-between; padding: 12px; background-color: var(--secondary); margin-bottom: 8px; border-radius: 5px; font-size: 1.1rem; font-weight: bold;
        }
        .leaderboard-item:nth-child(1) { border-left: 5px solid gold; }
        .leaderboard-item:nth-child(2) { border-left: 5px solid silver; }
        .leaderboard-item:nth-child(3) { border-left: 5px solid #cd7f32; }

        /* --- Option 5 : Bouton Retour en haut --- */
        #scroll-to-top {
            position: fixed; bottom: 20px; right: 20px;
            background-color: var(--accent); color: white;
            border: none; border-radius: 50%;
            width: 45px; height: 45px; font-size: 1.2rem;
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            display: none; justify-content: center; align-items: center;
            z-index: 99; -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>Bienvenue à l'Eurovision !</h2>
            <p>Choisis un pseudo pour jouer avec tes amis.</p>
            <input type="text" id="username-input" placeholder="Ton pseudo...">
            <button onclick="login()">C'est parti !</button>
        </div>
    </div>

    <h1>Eurovision 2026</h1>

    <div id="mode-banner">Mode Solo/Local (Erreur de connexion à Firebase)</div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab-my-ranking', this)">Mon Classement</button>
        <button class="tab-btn" id="btn-tab-leaderboard" onclick="switchTab('tab-leaderboard', this)">Tableau des Scores</button>
        <button class="tab-btn" onclick="switchTab('tab-official', this)">Résultats Officiels</button>
    </div>

    <div id="tab-my-ranking" class="tab-content active">
        <div class="controls">
            <span>Connecté : <b id="display-username" style="color:var(--accent)">...</b></span>
            <button class="btn-action" onclick="resetData('my')">Réinitialiser l'ordre</button>
        </div>
        <div id="score-board" style="display: none;"></div>
        <ul id="my-list"></ul>
    </div>

    <div id="tab-leaderboard" class="tab-content">
        <h2 style="text-align:center; color:white;">Classement Général</h2>
        <div id="leaderboard-box"></div>
    </div>

    <div id="tab-official" class="tab-content">
        <p class="warning-text" id="official-warning">⚠️ Modifier ce classement le changera en temps réel pour tous vos amis.</p>
        <div class="controls">
            <span>Vrai Classement Final :</span>
            <button class="btn-action" onclick="resetData('official')">Réinitialiser l'officiel</button>
        </div>
        <ul id="official-list"></ul>
    </div>

    <button id="scroll-to-top" onclick="scrollToTop()">▲</button>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCCHQQbX0jJtgEliea4ELZ8vi4T6awhW3k",
            authDomain: "babyfoot-dae17.firebaseapp.com",
            databaseURL: "https://babyfoot-dae17-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "babyfoot-dae17",
            storageBucket: "babyfoot-dae17.firebasestorage.app",
            messagingSenderId: "203273116160",
            appId: "1:203273116160:web:8bcad4501d6d8fccb096e5"
        };

        const defaultData = [
            { id: '1', country: 'Danemark', artist: 'Seren Torpegaard Lund', song: 'Før Vi Går Hjem' },
            { id: '2', country: 'Allemagne', artist: 'Sarah Engels', song: 'Fire' },
            { id: '3', country: 'Israël', artist: 'Noam Bettan', song: 'Michelle' },
            { id: '4', country: 'Belgique', artist: 'ESSYLA', song: 'Dancing on the ice' },
            { id: '5', country: 'Albanie', artist: 'Alis', song: 'Nën' },
            { id: '6', country: 'Grèce', artist: 'Akylas', song: 'Ferto' },
            { id: '7', country: 'Ukraine', artist: 'LELEKA', song: 'Ridnym' },
            { id: '8', country: 'Australie', artist: 'Delta Goodrem', song: 'Eclipse' },
            { id: '9', country: 'Serbie', artist: 'LAVINA', song: 'Kraj Mene' },
            { id: '10', country: 'Malte', artist: 'AIDAN', song: 'Bella' },
            { id: '11', country: 'Tchéquie', artist: 'Daniel Zizka', song: 'CROSSROADS' },
            { id: '12', country: 'Bulgarie', artist: 'DARA', song: 'Bangaranga' },
            { id: '13', country: 'Croatie', artist: 'LELEK', song: 'Andromeda' },
            { id: '14', country: 'Royaume-Uni', artist: 'LOOK MUM NO COMPUTER', song: 'Eins, Zwei, Drei' },
            { id: '15', country: 'France', artist: 'Monroe', song: 'Regarde !' },
            { id: '16', country: 'Moldavie', artist: 'Satoshi', song: 'Viva, Moldova!' },
            { id: '17', country: 'Finlande', artist: 'Linda Lampenius x Pete Parkkonen', song: 'Liekinheitin' },
            { id: '18', country: 'Pologne', artist: 'ALICJA', song: 'Pray' },
            { id: '19', country: 'Lituanie', artist: 'Lion Ceccah', song: 'Sólo Quiero Más' },
            { id: '20', country: 'Suède', artist: 'FELICIA', song: 'My System' },
            { id: '21', country: 'Chypre', artist: 'Antigoni', song: 'JALLA' },
            { id: '22', country: 'Italie', artist: 'Sal Da Vinci', song: 'Per Sempre Sì' },
            { id: '23', country: 'Norvège', artist: 'JONAS LOVV', song: 'YA YA YA' },
            { id: '24', country: 'Roumanie', artist: 'Alexandra Căpitănescu', song: 'Choke Me' },
            { id: '25', country: 'Autriche', artist: 'COSMÖ', song: 'Tanzschein' }
        ];

        let db = null;
        let isFirebaseReady = false;
        let currentUser = localStorage.getItem('eurovision_user');
        
        let myState = JSON.parse(localStorage.getItem('eurovision2026_local_mystate')) || [...defaultData];
        let officialState = JSON.parse(localStorage.getItem('eurovision2026_local_officialstate')) || [...defaultData];
        let notes = JSON.parse(localStorage.getItem('eurovision2026_notes')) || {};
        
        let myLocked = JSON.parse(localStorage.getItem('eurovision2026_local_mylocked')) || {};
        let officialLocked = JSON.parse(localStorage.getItem('eurovision2026_local_officiallocked')) || {};

        // Variables pour suivre le dernier pays déplacé (Option 4)
        let lastMovedMyId = null;
        let lastMovedOfficialId = null;
        
        // État d'ouverture des notes (Option 1)
        let openedNotes = {};

        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            isFirebaseReady = true;
        } catch (e) {
            console.error("Échec d'initialisation Firebase, bascule en local.", e);
        }

        if (!isFirebaseReady) {
            document.getElementById('mode-banner').style.display = 'block';
            document.getElementById('btn-tab-leaderboard').style.display = 'none';
            document.getElementById('official-warning').style.display = 'none';
        }

        if (currentUser) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('display-username').textContent = currentUser;
            initApp();
        }

        function login() {
            const input = document.getElementById('username-input').value.trim();
            if (input.length > 1) {
                currentUser = input;
                localStorage.setItem('eurovision_user', currentUser);
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('display-username').textContent = currentUser;
                initApp();
            } else { alert("Choisis un pseudo !"); }
        }

        function initApp() {
            if (isFirebaseReady) {
                db.ref('official_ranking').on('value', snap => {
                    if (snap.val()) officialState = snap.val().map(id => defaultData.find(d => d.id === id));
                    localStorage.setItem('eurovision2026_local_officialstate', JSON.stringify(officialState));
                    renderList(officialState, 'official-list', true); calculateScore();
                });
                db.ref('official_locked').on('value', snap => {
                    officialLocked = snap.val() || {};
                    localStorage.setItem('eurovision2026_local_officiallocked', JSON.stringify(officialLocked));
                    renderList(officialState, 'official-list', true);
                });

                db.ref('users/' + currentUser + '/ranking').once('value', snap => {
                    if (snap.val()) { myState = snap.val().map(id => defaultData.find(d => d.id === id)); } 
                    else { db.ref('users/' + currentUser + '/ranking').set(myState.map(c => c.id)); }
                    renderList(myState, 'my-list', false); calculateScore();
                });
                db.ref('users/' + currentUser + '/locked').once('value', snap => {
                    if (snap.val()) myLocked = snap.val() || {};
                    renderList(myState, 'my-list', false);
                });

                db.ref('users').on('value', snap => { if (snap.val()) updateLeaderboard(snap.val()); });
            } else {
                renderList(myState, 'my-list', false);
                renderList(officialState, 'official-list', true);
                calculateScore();
            }
        }

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        function toggleLock(id, isOfficial) {
            let state = isOfficial ? officialState : myState;
            let lockedMap = isOfficial ? officialLocked : myLocked;
            if (lockedMap[id] !== undefined) { delete lockedMap[id]; } 
            else { lockedMap[id] = state.findIndex(c => c.id === id); }
            processMove(isOfficial);
        }

        // Option 1 : Gestion de l'affichage rétractable de la note
        function toggleNotesVisibility(id) {
            const el = document.getElementById(`notes-wrap-${id}`);
            const btn = document.getElementById(`notes-btn-${id}`);
            if (el.style.display === "block") {
                el.style.display = "none";
                btn.textContent = "📝 Ajouter/Voir la note";
                openedNotes[id] = false;
            } else {
                el.style.display = "block";
                btn.textContent = "❌ Fermer la note";
                openedNotes[id] = true;
            }
        }

        function renderList(stateArray, listId, isOfficial) {
            const listElement = document.getElementById(listId);
            listElement.innerHTML = '';
            if(!stateArray || stateArray.length === 0) return;
            
            let lockedMap = isOfficial ? officialLocked : myLocked;
            let lastMovedId = isOfficial ? lastMovedOfficialId : lastMovedMyId;

            stateArray.forEach((item, index) => {
                const li = document.createElement('li');
                let isLocked = lockedMap[item.id] !== undefined;
                li.className = isLocked ? 'card is-locked' : 'card';
                
                // Option 4 : Application de l'animation Flash
                if (item.id === lastMovedId) {
                    li.className += ' flash-update';
                }
                
                let optionsHtml = '';
                for(let i = 1; i <= 25; i++) {
                    let isSlotLockedByOther = false;
                    let itemAtSlot = stateArray[i - 1];
                    if (itemAtSlot && lockedMap[itemAtSlot.id] !== undefined && (i - 1) !== index) { isSlotLockedByOther = true; }
                    let disabledAttr = isSlotLockedByOther ? 'disabled' : '';
                    let text = isSlotLockedByOther ? `${i} (Verrouillé)` : i;
                    optionsHtml += `<option value="${i}" ${i === index + 1 ? 'selected' : ''} ${disabledAttr}>${text}</option>`;
                }

                // Option 1 : Structure des Notes Rétractables
                let noteIsOpen = openedNotes[item.id] === true;
                let extraContent = isOfficial ? '' : `
                    <button class="notes-btn" id="notes-btn-${item.id}" onclick="toggleNotesVisibility('${item.id}')">
                        ${noteIsOpen ? '❌ Fermer la note' : '📝 Ajouter/Voir la note'}
                    </button>
                    <div class="notes-wrapper" id="notes-wrap-${item.id}" style="display: ${noteIsOpen ? 'block' : 'none'};">
                        <textarea placeholder="Notes sur la prestation..." onchange="saveNote('${item.id}', this.value)">${notes[item.id] || ''}</textarea>
                    </div>`;

                let lockIcon = isLocked ? '🔒' : '🔓';
                let lockClass = isLocked ? 'lock-btn locked' : 'lock-btn';
                let disableMove = isLocked ? 'disabled' : '';

                li.innerHTML = `
                    <div class="rank-controls">
                        <button class="${lockClass}" onclick="toggleLock('${item.id}', ${isOfficial})" title="Verrouiller">${lockIcon}</button>
                        <button class="move-btn" onclick="moveItem(${index}, -1, ${isOfficial})" ${index === 0 || isLocked ? 'disabled' : ''}>▲</button>
                        <select class="rank-select" onchange="jumpItem(${index}, this.value, ${isOfficial})" ${disableMove}>
                            ${optionsHtml}
                        </select>
                        <button class="move-btn" onclick="moveItem(${index}, 1, ${isOfficial})" ${index === 24 || isLocked ? 'disabled' : ''}>▼</button>
                    </div>
                    <div class="content">
                        <div class="info">
                            <span class="country">${item.country}</span>
                            <span class="artist-song"><strong>${item.artist}</strong></span>
                        </div>
                        ${extraContent}
                    </div>
                `;
                listElement.appendChild(li);
            });

            // Nettoie l'ID du flash après le rendu
            if (isOfficial) lastMovedOfficialId = null;
            else lastMovedMyId = null;
        }

        function saveNote(id, text) {
            notes[id] = text;
            localStorage.setItem('eurovision2026_notes', JSON.stringify(notes));
        }

        function applyLocks(stateArray, lockedMap) {
            let locks = [];
            for (let id in lockedMap) {
                let targetIdx = lockedMap[id];
                let currentIdx = stateArray.findIndex(item => item.id === id);
                if (currentIdx !== -1) locks.push({ id: id, targetIdx: targetIdx, item: stateArray[currentIdx] });
            }
            locks.sort((a, b) => a.targetIdx - b.targetIdx);
            let unlockedArray = stateArray.filter(item => lockedMap[item.id] === undefined);
            locks.forEach(lock => { unlockedArray.splice(lock.targetIdx, 0, lock.item); });
            stateArray.length = 0; stateArray.push(...unlockedArray);
        }

        function moveItem(index, direction, isOfficial) {
            let state = isOfficial ? officialState : myState;
            let lockedMap = isOfficial ? officialLocked : myLocked;

            let newIndex = index + direction;
            while (newIndex >= 0 && newIndex < state.length && lockedMap[state[newIndex].id] !== undefined) {
                newIndex += direction;
            }

            if (newIndex >= 0 && newIndex < state.length) {
                const item = state.splice(index, 1)[0];
                state.splice(newIndex, 0, item);
                
                // Mémorise pour l'effet Flash (Option 4)
                if (isOfficial) lastMovedOfficialId = item.id;
                else lastMovedMyId = item.id;

                applyLocks(state, lockedMap);
                processMove(isOfficial);
            }
        }

        function jumpItem(oldIndex, newIndexStr, isOfficial) {
            let state = isOfficial ? officialState : myState;
            let lockedMap = isOfficial ? officialLocked : myLocked;
            const newIndex = parseInt(newIndexStr) - 1;
            
            if (newIndex !== oldIndex && newIndex >= 0 && newIndex < state.length) {
                const item = state.splice(oldIndex, 1)[0];
                state.splice(newIndex, 0, item);

                // Mémorise pour l'effet Flash (Option 4)
                if (isOfficial) lastMovedOfficialId = item.id;
                else lastMovedMyId = item.id;

                applyLocks(state, lockedMap);
                processMove(isOfficial);
            }
        }

        function processMove(isOfficial) {
            if (isOfficial) {
                if (isFirebaseReady) {
                    db.ref('official_ranking').set(officialState.map(c => c.id));
                    db.ref('official_locked').set(officialLocked);
                } else {
                    localStorage.setItem('eurovision2026_local_officialstate', JSON.stringify(officialState));
                    localStorage.setItem('eurovision2026_local_officiallocked', JSON.stringify(officialLocked));
                    renderList(officialState, 'official-list', true); calculateScore();
                }
            } else {
                if (isFirebaseReady) {
                    db.ref('users/' + currentUser + '/ranking').set(myState.map(c => c.id));
                    db.ref('users/' + currentUser + '/locked').set(myLocked);
                } else {
                    localStorage.setItem('eurovision2026_local_mystate', JSON.stringify(myState));
                    localStorage.setItem('eurovision2026_local_mylocked', JSON.stringify(myLocked));
                }
                renderList(myState, 'my-list', false); calculateScore();
            }
        }

        function resetData(type) {
            const code = prompt("Code administrateur requis pour réinitialiser :");
            if (code === "7777") {
                if (confirm("Admin autorisé. Réinitialiser et déverrouiller tous les pays ?")) {
                    if (type === 'my') {
                        myState = [...defaultData]; myLocked = {}; openedNotes = {}; processMove(false);
                    } else {
                        officialState = [...defaultData]; officialLocked = {}; processMove(true);
                    }
                }
            } else if (code !== null) { alert("Code incorrect ! Accès refusé."); }
        }

        function calculateScore() {
            if (!myState.length || !officialState.length) return;
            let score = 0; let detailsHtml = '';
            
            myState.forEach((myCountry, myIndex) => {
                let officialIndex = officialState.findIndex(o => o.id === myCountry.id);
                let diff = Math.abs(myIndex - officialIndex);
                let pointsGained = diff === 0 ? 10 : (diff === 1 ? 8 : (diff >= 2 && diff <= 8 ? 9 - diff : 0));

                let bonus = 0; let bonusLabel = "";
                if (diff === 0) {
                    if (myIndex === 0) { bonus = 10; bonusLabel = "⭐ 1er (+10)"; }
                    if (myIndex === 1) { bonus = 10; bonusLabel = "⭐ 2e (+10)"; }
                    if (myIndex === 2) { bonus = 10; bonusLabel = "⭐ 3e (+10)"; }
                    if (myIndex === 22) { bonus = 10; bonusLabel = "⭐ 23e (+10)"; }
                    if (myIndex === 23) { bonus = 10; bonusLabel = "⭐ 24e (+10)"; }
                    if (myIndex === 24) { bonus = 10; bonusLabel = "⭐ 25e (+10)"; }
                }

                let totalPointsLine = pointsGained + bonus; score += totalPointsLine;
                let color = totalPointsLine > 0 ? 'var(--success)' : '#777';
                let ptsText = totalPointsLine > 0 ? `+${pointsGained} pts` : `0 pt`;

                detailsHtml += `
                    <div class="score-detail">
                        <span>${myIndex + 1}. ${myCountry.country}</span>
                        <span style="text-align:right; color:${color}">
                            (Vrai: ${officialIndex + 1}) <b>${ptsText}</b>
                            ${bonusLabel ? `<br><span class="bonus-badge">${bonusLabel}</span>` : ''}
                        </span>
                    </div>`;
            });

            if (isFirebaseReady) db.ref('users/' + currentUser + '/score').set(score);
            const board = document.getElementById('score-board');
            board.innerHTML = `<h2 class="score-title">Score : ${score} Pts</h2>
                               <details><summary style="cursor:pointer; color:var(--accent); text-align:center;">Détail des points</summary>
                               ${detailsHtml}</details>`;
            board.style.display = 'block';
        }

        function updateLeaderboard(usersData) {
            const box = document.getElementById('leaderboard-box');
            box.innerHTML = ''; let players = [];
            for (let user in usersData) players.push({ name: user, score: usersData[user].score || 0 });
            players.sort((a, b) => b.score - a.score);
            players.forEach((player, index) => {
                const div = document.createElement('div'); div.className = 'leaderboard-item';
                div.innerHTML = `<span>${index + 1}. ${player.name}</span><span style="color:var(--success)">${player.score} pts</span>`;
                box.appendChild(div);
            });
        }

        // Option 5 : Gestion du bouton de retour en haut de page
        window.onscroll = function() {
            const btn = document.getElementById("scroll-to-top");
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                btn.style.display = "flex";
            } else {
                btn.style.display = "none";
            }
        };

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
